name: Release

# Publishes a tagged release. Push a tag "v<version>" on a commit on main,
# where <version> is the exact __version__ in src/pyrock/_version.py
# (X.Y.Z, or X.Y.Z with an aN, bN or rcN suffix for a prerelease). Then:
#   1. verify  - tag format, tag == package version, dated CHANGELOG section,
#                and the tagged commit is on main;
#   2. ci      - the full CI workflow (matrix, compat, stress, build);
#   3. pypi    - publishes the exact files CI built and checked to the PyPI
#                project `bedrock-py` (the import package is `pyrock`),
#                using trusted publishing (OIDC, no stored token);
#   4. github  - creates the GitHub Release with the CHANGELOG notes and the
#                distribution files attached.
#
# Actions are pinned to full commit SHAs (the comment names the release).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag, version and changelog
        id: check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        # scripts/release.py is stdlib-only and never imports pyrock.
        run: python3 scripts/release.py check "$RELEASE_TAG" | tee -a "$GITHUB_OUTPUT"
      - name: Check the tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit on main." >&2
            exit 1
          }

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  pypi:
    name: Publish to PyPI
    needs: [verify, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/bedrock-py/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Check the distribution matches the tag
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ls -l dist/
          test -f "dist/bedrock_py-${VERSION}-py3-none-any.whl"
          test -f "dist/bedrock_py-${VERSION}.tar.gz"
          test "$(ls dist | wc -l)" -eq 2
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github:
    name: Create GitHub Release
    needs: [verify, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Write release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: python3 scripts/release.py notes "$VERSION" --output notes.md
      - name: Create or verify the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          # Re-running is safe: an existing release must match this tag.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            state=$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease)
            if [[ "$(jq -r .tagName <<< "$state")" != "$RELEASE_TAG" \
               || "$(jq -r .isDraft <<< "$state")" != "false" \
               || "$(jq -r .isPrerelease <<< "$state")" != "$PRERELEASE" ]]; then
              echo "Existing release does not match verified tag $RELEASE_TAG: $state" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/* --clobber
            echo "Release $RELEASE_TAG already exists; assets refreshed."
            exit 0
          fi
          args=(--verify-tag --title "pyrock $RELEASE_TAG" --notes-file notes.md)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" dist/*
