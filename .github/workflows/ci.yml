name: CI

# Actions are pinned to full commit SHAs (the comment names the release).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The tagged-release workflow runs the full CI as a gate before publishing.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"
  FORCE_COLOR: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint (ruff, mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy --strict src

  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15"]
        include:
          - python: "3.14"
            coverage: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Disable the GIL on free-threaded builds
        if: endsWith(matrix.python, 't')
        run: echo "PYTHON_GIL=0" >> "$GITHUB_ENV"
      # setup-uv sets UV_PYTHON; `uv sync` installs that interpreter on demand
      # (pre-releases included: "3.15" resolves to the 3.15 pre-release).
      - run: uv sync --group dev
      - name: Interpreter info (must match the matrix entry)
        env:
          EXPECTED: ${{ matrix.python }}
        shell: uv run python {0}
        run: |
          import os, sys, sysconfig

          free_threaded = bool(sysconfig.get_config_var("Py_GIL_DISABLED"))
          print(sys.version)
          print("free-threaded:", free_threaded)
          expected = os.environ["EXPECTED"]
          want = expected.removesuffix("t")
          got = f"{sys.version_info.major}.{sys.version_info.minor}"
          assert got == want, f"asked for {expected}, got {got}"
          assert free_threaded == expected.endswith("t"), "free-threaded mismatch"
      - name: Tests
        if: ${{ !matrix.coverage }}
        run: uv run pytest
      - name: Tests with coverage (>= 80% branch, forked children included)
        if: ${{ matrix.coverage }}
        run: |
          uv run coverage run -m pytest
          uv run coverage combine -q
          uv run coverage report

  stress:
    name: stress (3.14t, PYTHON_GIL=0, 10 runs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON_GIL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14t"
          enable-cache: true
      - run: uv sync --group dev
      - name: Repeat the fork, context, batch and server tests
        run: make stress STRESS_RUNS=10

  test-os:
    name: test (${{ matrix.os }}, 3.14)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run pytest

  compat:
    name: compat (official OTLP protos, real grpcio)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --group dev --group compat
      - run: uv run pytest -m compat -rs

  build:
    name: build (pure wheel, no dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - run: uv build
      - name: Check wheel metadata
        shell: python
        run: |
          import email.parser, glob, re, sys, zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          assert wheel.endswith("-py3-none-any.whl"), f"not a pure-python wheel: {wheel}"
          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()
              meta_name = next(n for n in names if n.endswith(".dist-info/METADATA"))
              wheel_name = next(n for n in names if n.endswith(".dist-info/WHEEL"))
              meta = email.parser.Parser().parsestr(zf.read(meta_name).decode())
              wheel_meta = email.parser.Parser().parsestr(zf.read(wheel_name).decode())
          source = open("src/pyrock/_version.py", encoding="utf-8").read()
          version = re.search(r'^__version__ = "([^"]+)"', source, re.M).group(1)
          assert meta["Version"] == version, (meta["Version"], version)
          requires = meta.get_all("Requires-Dist") or []
          assert not requires, f"wheel declares runtime dependencies: {requires}"
          assert wheel_meta["Root-Is-Purelib"] == "true", wheel_meta["Root-Is-Purelib"]
          assert wheel_meta.get_all("Tag") == ["py3-none-any"], wheel_meta.get_all("Tag")
          assert "pyrock/py.typed" in names, "py.typed missing from wheel"
          compiled = [n for n in names if n.endswith((".so", ".pyd", ".dylib"))]
          assert not compiled, compiled
          print(f"{wheel}: OK (version {version}, {len(names)} files, no Requires-Dist)")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
